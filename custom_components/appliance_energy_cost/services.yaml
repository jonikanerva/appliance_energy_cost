    config_entry:
      required: true
      selector:
        config_entry:
          integration: appliance_energy_cost
    start:
      required: false
      selector:
        datetime:
    end:
      required: false
      selector:
        datetime:
    appliances:
      required: false
      selector:
        entity:
          multiple: true
          filter:
            domain: sensor
            device_class: energy
    strict:
      required: false
      default: true
      selector:
        boolean:
import_backfill:
  # Field order is UI order. The `default: true` on overwrite_existing and
  # calibrate is a UI prefill for the first-run "full solution" recipe; the
  # value travels explicitly in the payload, and the vol schema defaults stay
  # false so automations that omit the flags stay conservative (issue #42).
  # INVARIANT: confirm keeps `default: false` and stays LAST.
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: appliance_energy_cost
    start:
      required: false
      selector:
        datetime:
    end:
      required: false
      selector:
        datetime:
    appliances:
      required: false
      selector:
        entity:
          multiple: true
          filter:
            domain: sensor
            device_class: energy
    overwrite_existing:
      required: false
      default: true
      selector:
        boolean:
    calibrate:
      required: false
      default: true
      selector:
        boolean:
    initial_cost:
      required: false
      selector:
        number:
          mode: box
          step: any
    strict:
      required: false
      default: true
      selector:
        boolean:
    confirm:
      required: false
      default: false
      selector:
        boolean:
calibrate_cost:
  target:
    entity:
      domain: sensor
      integration: appliance_energy_cost
  fields:
    value:
      required: true
      selector:
        number:
          mode: box
          step: any
