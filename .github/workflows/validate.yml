name: Validate

# hassfest and HACS validation are the only gates that cannot run locally, so
# they run in CI against main (release verification + upstream-rule-drift
# detection). The quality gate ($VERIFY_CMD) is local-first; there is no
# per-PR CI by product-owner decision (2026-07-27, see issue #1).
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      # hacs/action clones the repository itself; no checkout step per HACS docs.
      # brands/license/description/topics read GitHub repo metadata that no PR
      # can deliver; tracked as a follow-up to shrink this list.
      - uses: hacs/action@main
        with:
          category: integration
          ignore: "brands license description topics"
          comment: false
