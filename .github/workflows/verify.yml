name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: mise run setup
      # $VERIFY_CMD from STACK.md section 3 — keep in sync, never reword.
      - run: uv run ruff format --check . && uv run ruff check . && uv run mypy custom_components && uv run pytest
